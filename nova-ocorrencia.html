<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ocorrência - Defesa Civil</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>Defesa Civil</h1>
                    <span>Nova Ocorrência</span>
                </div>
            </div>
            <nav class="header-nav">
                <a href="ocorrencias.html" class="btn btn-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 19-7-7 7-7"/>
                        <path d="M19 12H5"/>
                    </svg>
                    Voltar
                </a>
            </nav>
        </div>
    </header>

    <main class="main-content form-content">
        <form id="ocorrencia-form" class="report-form">
            <section class="form-section">
                <h2 class="section-title">
                    <span class="section-number">1</span>
                    Identificação
                </h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="protocolo">Nº do Protocolo</label>
                        <input type="text" id="protocolo" name="protocolo" required readonly class="readonly-field">
                    </div>
                    <div class="form-group">
                        <label for="data_ocorrencia">Data da Ocorrência</label>
                        <input type="date" id="data_ocorrencia" name="data_ocorrencia" required>
                    </div>
                    <div class="form-group">
                        <label for="hora_ocorrencia">Hora</label>
                        <input type="time" id="hora_ocorrencia" name="hora_ocorrencia" required>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="section-title">
                    <span class="section-number">2</span>
                    Tipo de Ocorrência
                </h2>
                <div class="form-group">
                    <label for="tipo_ocorrencia">Tipo</label>
                    <select id="tipo_ocorrencia" name="tipo_ocorrencia" required>
                        <option value="">Selecione...</option>
                        <option value="Alagamento">Alagamento</option>
                        <option value="Deslizamento">Deslizamento</option>
                        <option value="Desabamento">Desabamento</option>
                        <option value="Incêndio">Incêndio</option>
                        <option value="Vendaval">Vendaval</option>
                        <option value="Queda de Árvore">Queda de Árvore</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="tipo_outro">Outro (especificar)</label>
                    <input type="text" id="tipo_outro" name="tipo_outro">
                </div>
            </section>

            <section class="form-section">
                <h2 class="section-title">
                    <span class="section-number">3</span>
                    Localização
                </h2>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="endereco">Endereço Completo</label>
                        <input type="text" id="endereco" name="endereco" required>
                    </div>
                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" required>
                    </div>
                    <div class="form-group">
                        <label for="referencia">Ponto de Referência</label>
                        <input type="text" id="referencia" name="referencia">
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="section-title">
                    <span class="section-number">4</span>
                    Descrição
                </h2>
                <div class="form-group">
                    <label for="descricao">Descrição da Ocorrência</label>
                    <textarea id="descricao" name="descricao" rows="4" required placeholder="Descreva detalhadamente a ocorrência..."></textarea>
                </div>
                <div class="form-group">
                    <label for="gravidade">Gravidade</label>
                    <select id="gravidade" name="gravidade" required>
                        <option value="">Selecione...</option>
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                        <option value="Crítica">Crítica</option>
                    </select>
                </div>
            </section>

            <section class="form-section">
                <h2 class="section-title">
                    <span class="section-number">5</span>
                    Solicitante
                </h2>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="nome_solicitante">Nome do Solicitante</label>
                        <input type="text" id="nome_solicitante" name="nome_solicitante">
                    </div>
                    <div class="form-group">
                        <label for="telefone_solicitante">Telefone</label>
                        <input type="tel" id="telefone_solicitante" name="telefone_solicitante" placeholder="(00) 00000-0000">
                    </div>
                    <div class="form-group">
                        <label for="cpf_solicitante">CPF</label>
                        <input type="text" id="cpf_solicitante" name="cpf_solicitante" placeholder="000.000.000-00">
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="section-title">
                    <span class="section-number">6</span>
                    Agente Responsável
                </h2>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="nome_agente">Nome do Agente</label>
                        <input type="text" id="nome_agente" name="nome_agente" required>
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Salvar Ocorrência
                </button>
            </div>
        </form>
    </main>

    <div id="toast" class="toast"></div>

    <footer class="footer">
        <p>&copy; 2025 Defesa Civil - Prefeitura Municipal. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/nova-ocorrencia.js"></script>
</body>
</html>
